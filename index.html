<!DOCTYPE html>
<html lang="uk">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Бюджет</title>
<style>
  *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }

  :root {
    --bg:       #16181C;
    --surface:  #1E2128;
    --card:     #252830;
    --border:   #2E3240;
    --gold:     #C9A84C;
    --gold-dim: #8A6F2F;
    --text:     #E8E8EE;
    --muted:    #7A7F8E;
    --danger:   #E05C5C;
    --ok:       #5CB88A;
    --font: -apple-system, 'Segoe UI', system-ui, sans-serif;
  }

  body {
    background: var(--bg);
    color: var(--text);
    font-family: var(--font);
    min-height: 100vh;
    padding-bottom: 80px;
  }

  /* ── TOP BAR ── */
  .topbar {
    position: sticky; top: 0; z-index: 100;
    background: var(--bg);
    border-bottom: 1px solid var(--border);
    padding: 14px 20px;
    display: flex; align-items: center; justify-content: space-between;
  }
  .topbar h1 { font-size: 17px; font-weight: 700; letter-spacing: -.3px; }
  .topbar h1 span { color: var(--gold); }
  .month-nav { display: flex; align-items: center; gap: 10px; }
  .month-nav button {
    background: var(--card); border: 1px solid var(--border);
    color: var(--text); width: 30px; height: 30px; border-radius: 8px;
    cursor: pointer; font-size: 14px; display: flex; align-items: center; justify-content: center;
  }
  .month-nav button:hover { border-color: var(--gold); color: var(--gold); }
  #month-label { font-size: 13px; font-weight: 600; min-width: 90px; text-align: center; }

  /* ── RING ── */
  .ring-wrap {
    display: flex; flex-direction: column; align-items: center;
    padding: 28px 20px 20px;
  }
  .ring-container { position: relative; width: 180px; height: 180px; }
  .ring-container svg { transform: rotate(-90deg); }
  .ring-track { fill: none; stroke: var(--card); stroke-width: 14; }
  .ring-fill  { fill: none; stroke-width: 14; stroke-linecap: round; transition: stroke-dashoffset .6s cubic-bezier(.4,0,.2,1), stroke .4s; }
  .ring-center {
    position: absolute; inset: 0;
    display: flex; flex-direction: column; align-items: center; justify-content: center;
  }
  .ring-spent { font-size: 26px; font-weight: 800; letter-spacing: -1px; }
  .ring-label { font-size: 11px; color: var(--muted); margin-top: 2px; }
  .ring-remain { font-size: 13px; font-weight: 600; margin-top: 4px; }

  .ring-stats {
    display: flex; gap: 28px; margin-top: 16px;
  }
  .ring-stat { text-align: center; }
  .ring-stat .val { font-size: 15px; font-weight: 700; }
  .ring-stat .lbl { font-size: 11px; color: var(--muted); margin-top: 1px; }

  /* ── BUDGET SETUP ── */
  .setup-btn {
    display: block; margin: 0 20px 6px;
    background: none; border: 1px dashed var(--border);
    color: var(--muted); padding: 8px 14px; border-radius: 10px;
    cursor: pointer; font-size: 13px; width: calc(100% - 40px); text-align: center;
  }
  .setup-btn:hover { border-color: var(--gold); color: var(--gold); }

  /* ── CATEGORIES ── */
  .section-title {
    font-size: 11px; font-weight: 700; letter-spacing: 1.2px;
    text-transform: uppercase; color: var(--muted);
    padding: 0 20px 8px;
  }

  .cat-list { padding: 0 14px; display: flex; flex-direction: column; gap: 8px; }

  .cat-card {
    background: var(--card); border: 1px solid var(--border);
    border-radius: 14px; padding: 13px 14px; cursor: pointer;
    transition: border-color .15s;
  }
  .cat-card:hover { border-color: var(--gold-dim); }

  .cat-top { display: flex; align-items: center; gap: 10px; margin-bottom: 9px; }
  .cat-icon { font-size: 20px; line-height: 1; width: 28px; text-align: center; }
  .cat-name { flex: 1; font-size: 14px; font-weight: 600; }
  .cat-amounts { text-align: right; }
  .cat-spent-val { font-size: 15px; font-weight: 700; }
  .cat-limit-val { font-size: 11px; color: var(--muted); }

  .cat-bar-wrap { height: 4px; background: var(--border); border-radius: 99px; overflow: hidden; }
  .cat-bar { height: 100%; border-radius: 99px; transition: width .5s cubic-bezier(.4,0,.2,1); }

  .cat-footer { display: flex; justify-content: space-between; margin-top: 7px; }
  .cat-remain { font-size: 12px; font-weight: 600; }
  .cat-pct { font-size: 12px; color: var(--muted); }

  /* ── ADD EXPENSE ── */
  .fab {
    position: fixed; bottom: 24px; right: 20px; z-index: 200;
    width: 56px; height: 56px; border-radius: 50%;
    background: var(--gold); color: #111; border: none;
    font-size: 26px; cursor: pointer; box-shadow: 0 4px 20px rgba(201,168,76,.4);
    display: flex; align-items: center; justify-content: center;
    transition: transform .15s, box-shadow .15s;
  }
  .fab:hover { transform: scale(1.07); box-shadow: 0 6px 28px rgba(201,168,76,.5); }
  .fab:active { transform: scale(.96); }

  /* ── MODAL ── */
  .overlay {
    display: none; position: fixed; inset: 0; z-index: 300;
    background: rgba(0,0,0,.65); backdrop-filter: blur(4px);
    align-items: flex-end; justify-content: center;
  }
  .overlay.open { display: flex; }

  .modal {
    background: var(--surface); border: 1px solid var(--border);
    border-radius: 22px 22px 0 0; padding: 20px 20px 36px;
    width: 100%; max-width: 480px;
    animation: slideUp .25s cubic-bezier(.4,0,.2,1);
  }
  @keyframes slideUp { from { transform: translateY(60px); opacity: 0; } to { transform: none; opacity: 1; } }

  .modal-title {
    font-size: 16px; font-weight: 700; margin-bottom: 18px;
    display: flex; align-items: center; justify-content: space-between;
  }
  .modal-close { background: none; border: none; color: var(--muted); font-size: 20px; cursor: pointer; }
  .modal-close:hover { color: var(--text); }

  .field { margin-bottom: 14px; }
  .field label { font-size: 12px; color: var(--muted); display: block; margin-bottom: 5px; font-weight: 600; text-transform: uppercase; letter-spacing: .8px; }
  .field input, .field select, .field textarea {
    width: 100%; background: var(--card); border: 1px solid var(--border);
    color: var(--text); border-radius: 10px; padding: 11px 14px;
    font-size: 15px; font-family: var(--font); outline: none;
    transition: border-color .15s;
  }
  .field input:focus, .field select:focus { border-color: var(--gold); }
  .field select option { background: var(--card); }

  .cat-chips {
    display: flex; flex-wrap: wrap; gap: 7px;
  }
  .chip {
    padding: 7px 13px; border-radius: 99px;
    border: 1.5px solid var(--border); background: var(--card);
    color: var(--text); font-size: 13px; cursor: pointer;
    transition: all .15s; white-space: nowrap;
  }
  .chip.active { border-color: var(--gold); background: rgba(201,168,76,.12); color: var(--gold); font-weight: 600; }

  .btn-primary {
    width: 100%; padding: 14px; border-radius: 12px;
    background: var(--gold); color: #111; border: none;
    font-size: 15px; font-weight: 700; cursor: pointer;
    margin-top: 6px; transition: opacity .15s;
  }
  .btn-primary:hover { opacity: .9; }
  .btn-primary:disabled { opacity: .4; cursor: default; }

  /* ── HISTORY ── */
  .tx-list { padding: 0 14px; display: flex; flex-direction: column; gap: 6px; }
  .tx-item {
    background: var(--card); border: 1px solid var(--border);
    border-radius: 12px; padding: 11px 13px;
    display: flex; align-items: center; gap: 10px;
  }
  .tx-icon { font-size: 18px; width: 24px; text-align: center; }
  .tx-info { flex: 1; min-width: 0; }
  .tx-desc { font-size: 14px; font-weight: 500; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
  .tx-meta { font-size: 11px; color: var(--muted); margin-top: 1px; }
  .tx-amount { font-size: 15px; font-weight: 700; color: var(--danger); white-space: nowrap; }
  .tx-del { background: none; border: none; color: var(--muted); cursor: pointer; font-size: 16px; padding: 2px 4px; border-radius: 6px; }
  .tx-del:hover { color: var(--danger); background: rgba(224,92,92,.1); }

  .empty { text-align: center; padding: 32px 20px; color: var(--muted); font-size: 14px; }

  /* ── BUDGET MODAL ── */
  .budget-grid { display: grid; grid-template-columns: 1fr 1fr; gap: 10px; }
  .budget-field label { font-size: 11px; color: var(--muted); display: block; margin-bottom: 4px; }
  .budget-field input {
    width: 100%; background: var(--card); border: 1px solid var(--border);
    color: var(--text); border-radius: 8px; padding: 9px 11px;
    font-size: 14px; font-family: var(--font); outline: none;
  }
  .budget-field input:focus { border-color: var(--gold); }

  /* ── TABS ── */
  .tabs {
    display: flex; gap: 6px; padding: 14px 14px 12px;
  }
  .tab {
    flex: 1; padding: 8px; border-radius: 10px; border: 1px solid var(--border);
    background: var(--card); color: var(--muted); font-size: 13px;
    font-weight: 600; cursor: pointer; text-align: center; transition: all .15s;
  }
  .tab.active { background: rgba(201,168,76,.12); border-color: var(--gold); color: var(--gold); }

  .tab-content { display: none; }
  .tab-content.active { display: block; }

  .spacer { height: 16px; }
</style>
</head>
<body>

<!-- TOP BAR -->
<div class="topbar">
  <h1>бюджет <span>·</span></h1>
  <div class="month-nav">
    <button onclick="changeMonth(-1)">‹</button>
    <div id="month-label"></div>
    <button onclick="changeMonth(1)">›</button>
  </div>
</div>

<!-- RING -->
<div class="ring-wrap">
  <div class="ring-container">
    <svg width="180" height="180" viewBox="0 0 180 180">
      <circle class="ring-track" cx="90" cy="90" r="76"/>
      <circle class="ring-fill" id="ring-fill" cx="90" cy="90" r="76"
        stroke-dasharray="477.5" stroke-dashoffset="477.5" stroke="var(--gold)"/>
    </svg>
    <div class="ring-center">
      <div class="ring-spent" id="ring-spent">0</div>
      <div class="ring-label">витрачено</div>
      <div class="ring-remain" id="ring-remain"></div>
    </div>
  </div>
  <div class="ring-stats">
    <div class="ring-stat">
      <div class="val" id="stat-budget">—</div>
      <div class="lbl">бюджет</div>
    </div>
    <div class="ring-stat">
      <div class="val" id="stat-txcount">0</div>
      <div class="lbl">витрат</div>
    </div>
    <div class="ring-stat">
      <div class="val" id="stat-days"></div>
      <div class="lbl">днів</div>
    </div>
  </div>
</div>

<!-- SETUP BTN -->
<button class="setup-btn" onclick="openBudgetModal()">⚙️ Встановити ліміти на місяць</button>

<!-- TABS -->
<div class="tabs">
  <button class="tab active" onclick="switchTab('cats')">Категорії</button>
  <button class="tab" onclick="switchTab('history')">Всі витрати</button>
</div>

<!-- CATS TAB -->
<div class="tab-content active" id="tab-cats">
  <div class="cat-list" id="cat-list"></div>
  <div class="spacer"></div>
</div>

<!-- HISTORY TAB -->
<div class="tab-content" id="tab-history">
  <div class="section-title" style="padding-top:2px">Останні витрати</div>
  <div class="tx-list" id="tx-list"></div>
  <div class="spacer"></div>
</div>

<!-- FAB -->
<button class="fab" onclick="openAddModal()" title="Додати витрату">+</button>

<!-- ADD MODAL -->
<div class="overlay" id="add-overlay" onclick="closeOnOverlay(event,'add-overlay')">
  <div class="modal">
    <div class="modal-title">
      Нова витрата
      <button class="modal-close" onclick="closeModal('add-overlay')">✕</button>
    </div>
    <div class="field">
      <label>Сума (₴)</label>
      <input type="number" id="inp-amount" placeholder="0" inputmode="decimal" min="0" step="any">
    </div>
    <div class="field">
      <label>Категорія</label>
      <div class="cat-chips" id="cat-chips"></div>
    </div>
    <div class="field">
      <label>Примітка (необов'язково)</label>
      <input type="text" id="inp-note" placeholder="Наприклад: АТБ, корм для Жужи…">
    </div>
    <div class="field">
      <label>Дата</label>
      <input type="date" id="inp-date">
    </div>
    <button class="btn-primary" onclick="addExpense()">Додати витрату</button>
  </div>
</div>

<!-- BUDGET MODAL -->
<div class="overlay" id="budget-overlay" onclick="closeOnOverlay(event,'budget-overlay')">
  <div class="modal">
    <div class="modal-title">
      Ліміти на місяць
      <button class="modal-close" onclick="closeModal('budget-overlay')">✕</button>
    </div>
    <div id="budget-fields" class="budget-grid"></div>
    <button class="btn-primary" style="margin-top:16px" onclick="saveBudget()">Зберегти</button>
  </div>
</div>

<script>
// ── DATA ──────────────────────────────────────────────────────────────

const CATS = [
  { id: 'food',    name: 'Їжа',                    icon: '🛒', color: '#6DB88A' },
  { id: 'cafe',    name: 'Кафе',                   icon: '☕', color: '#C9A84C' },
  { id: 'dog',     name: 'Собака',                 icon: '🐾', color: '#A07CDE' },
  { id: 'home',    name: 'Хімія та дім',           icon: '🧹', color: '#5BADD1' },
  { id: 'care',    name: 'Догляд за собою',        icon: '💄', color: '#E07BA8' },
  { id: 'card',    name: 'Списання з карти',       icon: '💳', color: '#E09D5B' },
  { id: 'reserve', name: 'Запас',                  icon: '🏦', color: '#7ABFE0' },
];

const DEFAULT_LIMITS = {
  food: 5000, cafe: 1500, dog: 1000,
  home: 800, care: 1200, card: 2000, reserve: 2000
};

// current month key: "2026-08"
function monthKey(y, m) { return `${y}-${String(m+1).padStart(2,'0')}`; }

let currentDate = new Date();
let cy = currentDate.getFullYear();
let cm = currentDate.getMonth(); // 0-indexed

function getKey() { return monthKey(cy, cm); }

function loadState() {
  try { return JSON.parse(localStorage.getItem('budget_v2') || '{}'); } catch { return {}; }
}
function saveState(s) { localStorage.setItem('budget_v2', JSON.stringify(s)); }

function getMonthData() {
  const s = loadState();
  const k = getKey();
  if (!s[k]) s[k] = { limits: { ...DEFAULT_LIMITS }, expenses: [] };
  if (!s[k].limits) s[k].limits = { ...DEFAULT_LIMITS };
  if (!s[k].expenses) s[k].expenses = [];
  return s[k];
}

function saveMonthData(data) {
  const s = loadState();
  s[getKey()] = data;
  saveState(s);
}

// ── MONTH NAV ──────────────────────────────────────────────────────────

const MONTHS_UK = ['Січень','Лютий','Березень','Квітень','Травень','Червень',
  'Липень','Серпень','Вересень','Жовтень','Листопад','Грудень'];

function updateMonthLabel() {
  document.getElementById('month-label').textContent = `${MONTHS_UK[cm]} ${cy}`;
  document.getElementById('stat-days').textContent = daysInMonth(cy, cm);
}

function daysInMonth(y, m) { return new Date(y, m+1, 0).getDate(); }

function changeMonth(d) {
  cm += d;
  if (cm < 0) { cm = 11; cy--; }
  if (cm > 11) { cm = 0; cy++; }
  updateMonthLabel();
  render();
}

// ── RENDER ──────────────────────────────────────────────────────────────

function render() {
  const data = getMonthData();
  const expenses = data.expenses || [];
  const limits = data.limits || {};

  // totals
  const totalBudget = Object.values(limits).reduce((a,b) => a + (b||0), 0);
  const totalSpent  = expenses.reduce((a,b) => a + b.amount, 0);
  const totalRemain = totalBudget - totalSpent;
  const pct = totalBudget > 0 ? Math.min(totalSpent / totalBudget, 1) : 0;

  // ring
  const circ = 477.5;
  const fill = document.getElementById('ring-fill');
  fill.style.strokeDashoffset = circ - circ * pct;
  fill.style.stroke = pct > .9 ? 'var(--danger)' : pct > .7 ? '#E09D5B' : 'var(--gold)';

  document.getElementById('ring-spent').textContent = fmt(totalSpent);
  const remEl = document.getElementById('ring-remain');
  if (totalBudget > 0) {
    remEl.textContent = totalRemain >= 0 ? `залишилось ${fmt(totalRemain)}` : `перевитрата ${fmt(-totalRemain)}`;
    remEl.style.color = totalRemain >= 0 ? 'var(--ok)' : 'var(--danger)';
  } else {
    remEl.textContent = 'ліміт не встановлено';
    remEl.style.color = 'var(--muted)';
  }

  document.getElementById('stat-budget').textContent = totalBudget > 0 ? fmt(totalBudget) : '—';
  document.getElementById('stat-txcount').textContent = expenses.length;

  // categories
  const catList = document.getElementById('cat-list');
  catList.innerHTML = '';
  CATS.forEach(cat => {
    const limit = limits[cat.id] || 0;
    const spent = expenses.filter(e => e.cat === cat.id).reduce((a,b) => a + b.amount, 0);
    const remain = limit - spent;
    const p = limit > 0 ? Math.min(spent / limit, 1) : 0;
    const over = spent > limit && limit > 0;

    const card = document.createElement('div');
    card.className = 'cat-card';
    card.style.borderColor = over ? 'rgba(224,92,92,.4)' : '';
    card.innerHTML = `
      <div class="cat-top">
        <div class="cat-icon">${cat.icon}</div>
        <div class="cat-name">${cat.name}</div>
        <div class="cat-amounts">
          <div class="cat-spent-val" style="color:${cat.color}">${fmt(spent)}</div>
          <div class="cat-limit-val">${limit > 0 ? 'з ' + fmt(limit) : 'без ліміту'}</div>
        </div>
      </div>
      <div class="cat-bar-wrap">
        <div class="cat-bar" style="width:${(p*100).toFixed(1)}%;background:${over ? 'var(--danger)' : cat.color}"></div>
      </div>
      <div class="cat-footer">
        <div class="cat-remain" style="color:${over ? 'var(--danger)' : 'var(--ok)'}">
          ${limit > 0 ? (over ? `⚠ перевитрата ${fmt(-remain)}` : `ще ${fmt(remain)}`) : ''}
        </div>
        <div class="cat-pct">${limit > 0 ? Math.round(p*100)+'%' : ''}</div>
      </div>
    `;
    card.onclick = () => openAddModal(cat.id);
    catList.appendChild(card);
  });

  // history
  const txList = document.getElementById('tx-list');
  txList.innerHTML = '';
  const sorted = [...expenses].sort((a,b) => b.ts - a.ts);
  if (sorted.length === 0) {
    txList.innerHTML = '<div class="empty">Витрат ще немає 🌿</div>';
  } else {
    sorted.forEach(exp => {
      const cat = CATS.find(c => c.id === exp.cat);
      const d = new Date(exp.ts);
      const dateStr = `${d.getDate()} ${MONTHS_UK[d.getMonth()].toLowerCase().slice(0,3)}`;
      const row = document.createElement('div');
      row.className = 'tx-item';
      row.innerHTML = `
        <div class="tx-icon">${cat ? cat.icon : '💸'}</div>
        <div class="tx-info">
          <div class="tx-desc">${exp.note || (cat ? cat.name : '')}</div>
          <div class="tx-meta">${cat ? cat.name : ''} · ${dateStr}</div>
        </div>
        <div class="tx-amount">−${fmt(exp.amount)}</div>
        <button class="tx-del" onclick="deleteExpense('${exp.id}',event)" title="Видалити">🗑</button>
      `;
      txList.appendChild(row);
    });
  }
}

function fmt(n) {
  if (n >= 1000) return (n/1000).toFixed(n % 1000 === 0 ? 0 : 1) + 'к';
  return Math.round(n) + '₴';
}

// ── ADD EXPENSE ──────────────────────────────────────────────────────────

let selectedCat = null;

function openAddModal(preselect) {
  selectedCat = preselect || null;

  // render chips
  const chips = document.getElementById('cat-chips');
  chips.innerHTML = '';
  CATS.forEach(cat => {
    const ch = document.createElement('button');
    ch.className = 'chip' + (cat.id === selectedCat ? ' active' : '');
    ch.textContent = cat.icon + ' ' + cat.name;
    ch.onclick = () => {
      selectedCat = cat.id;
      chips.querySelectorAll('.chip').forEach(c => c.classList.remove('active'));
      ch.classList.add('active');
    };
    chips.appendChild(ch);
  });

  // default date = today
  const today = new Date();
  document.getElementById('inp-date').value = today.toISOString().split('T')[0];
  document.getElementById('inp-amount').value = '';
  document.getElementById('inp-note').value = '';

  document.getElementById('add-overlay').classList.add('open');
  setTimeout(() => document.getElementById('inp-amount').focus(), 100);
}

function addExpense() {
  const amount = parseFloat(document.getElementById('inp-amount').value);
  if (!amount || amount <= 0) { alert('Введи суму'); return; }
  if (!selectedCat) { alert('Оберіть категорію'); return; }

  const dateVal = document.getElementById('inp-date').value;
  const ts = dateVal ? new Date(dateVal).getTime() : Date.now();
  const note = document.getElementById('inp-note').value.trim();

  const data = getMonthData();
  data.expenses.push({
    id: Date.now() + Math.random().toString(36).slice(2),
    cat: selectedCat,
    amount,
    note,
    ts,
  });
  saveMonthData(data);
  closeModal('add-overlay');
  render();
}

function deleteExpense(id, e) {
  e.stopPropagation();
  if (!confirm('Видалити цю витрату?')) return;
  const data = getMonthData();
  data.expenses = data.expenses.filter(ex => ex.id !== id);
  saveMonthData(data);
  render();
}

// ── BUDGET MODAL ──────────────────────────────────────────────────────────

function openBudgetModal() {
  const data = getMonthData();
  const limits = data.limits || {};

  const container = document.getElementById('budget-fields');
  container.innerHTML = '';
  CATS.forEach(cat => {
    const div = document.createElement('div');
    div.className = 'budget-field';
    div.innerHTML = `
      <label>${cat.icon} ${cat.name}</label>
      <input type="number" id="bl-${cat.id}" placeholder="0" min="0"
        value="${limits[cat.id] || ''}">
    `;
    container.appendChild(div);
  });

  document.getElementById('budget-overlay').classList.add('open');
}

function saveBudget() {
  const data = getMonthData();
  CATS.forEach(cat => {
    const val = parseFloat(document.getElementById('bl-' + cat.id).value);
    data.limits[cat.id] = isNaN(val) ? 0 : val;
  });
  saveMonthData(data);
  closeModal('budget-overlay');
  render();
}

// ── MODAL HELPERS ──────────────────────────────────────────────────────────

function closeModal(id) {
  document.getElementById(id).classList.remove('open');
}
function closeOnOverlay(e, id) {
  if (e.target.id === id) closeModal(id);
}

// ── TABS ──────────────────────────────────────────────────────────────

function switchTab(name) {
  document.querySelectorAll('.tab').forEach((t,i) => t.classList.toggle('active', ['cats','history'][i] === name));
  document.querySelectorAll('.tab-content').forEach(t => t.classList.remove('active'));
  document.getElementById('tab-' + name).classList.add('active');
}

// ── KEYBOARD ──────────────────────────────────────────────────────────────

document.addEventListener('keydown', e => {
  if (e.key === 'Escape') {
    document.querySelectorAll('.overlay.open').forEach(o => o.classList.remove('open'));
  }
});

// ── INIT ──────────────────────────────────────────────────────────────

updateMonthLabel();
render();
</script>
</body>
</html>
